<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Frontend Deployment Dashboard</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 40px;
        }

        h1{
            color: #333;
        }

        .container{
            background: white;
            width: 60%;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        .step{
            background: #e9ecef;
            padding: 15px;
            margin: 15px;
            border-radius: 8px;
            font-size: 18px;
        }

        .active{
            background: #90ee90;
            font-weight: bold;
        }

        button{
            padding: 12px 25px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        #logs{
            margin-top: 20px;
            background: black;
            color: lime;
            padding: 15px;
            border-radius: 8px;
            height: 180px;
            overflow-y: auto;
            text-align: left;
        }
    </style>
</head>

<body>

<h1>Deploying JavaScript Frontend Project</h1>

<div class="container">

    <div class="step" id="build">
        Step 1: Build Frontend Project
    </div>

    <div class="step" id="env">
        Step 2: Load Environment Variables
    </div>

    <div class="step" id="deploy">
        Step 3: Deploy to Netlify/Vercel/Firebase
    </div>

    <button onclick="startDeployment()">
        Start Deployment
    </button>

    <div id="logs">
        <h3>Deployment Logs</h3>
    </div>

</div>

<script>

const logs = document.getElementById("logs");

// Simulated Environment Variable
const API_URL =
"https://api.example.com";

function addLog(message){
    logs.innerHTML +=
    "<p>" + message + "</p>";
}

function activate(id){
    document
    .getElementById(id)
    .classList.add("active");
}

function startDeployment(){

    setTimeout(() => {
        activate("build");
        addLog(
        "Frontend project build successful");
    },1000);

    setTimeout(() => {
        activate("env");
        addLog(
        "Environment Variable Loaded:");
        addLog(
        "API_URL = " + API_URL);
    },3000);

    setTimeout(() => {
        activate("deploy");
        addLog(
        "Project deployed successfully to Vercel / Netlify / Firebase");
    },5000);
}

</script>
<p>Created by Monisha | 714025104148 </p>

</body>
</html>
